name: .NET

# The .NET solution beside the PowerShell module: build, tests on Windows and Linux, the published
# baseline.exe, the AOT canary, the status.json contract, parity with the module, and the hygiene checks.
# docs/DOTNET.md explains each job. The PowerShell module's own jobs are in ci.yml.

on:
  push:
    branches: [main, feat/dotnet-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build and test (.NET)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The exact SDK in global.json, by version. Given global-json-file, setup-dotnet turns rollForward
      # latestPatch into the feature band's channel (10.0.4xx) and installs the newest patch in it, whose
      # implicit packages (the trimming and AOT tools) would not match the lock files.
      - name: Read the SDK version from global.json
        id: sdk
        run: |
          $version = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install that SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # A folder of its own, so this SDK is the only one there: latestPatch cannot roll forward to a
          # newer one already on the image.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Check that the build uses that SDK
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          $actual = dotnet --version
          if ($actual -ne $env:SDK_VERSION) { throw "dotnet --version is $actual, but global.json names $env:SDK_VERSION" }

      - name: Restore (locked)
        run: dotnet restore Baseline.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build Baseline.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution Baseline.slnx --configuration Release --no-build

      - name: Publish baseline.exe (self-contained win-x64, ReadyToRun)
        run: dotnet publish src/Engramic.Baseline.Cli/Engramic.Baseline.Cli.csproj --configuration Release --runtime win-x64 --no-restore --output "$env:RUNNER_TEMP/baseline"

      - name: Run the published baseline.exe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'baseline'
          # Self-contained, and not single-file: the runtime and the app's own assemblies sit beside the exe.
          foreach ($file in 'coreclr.dll', 'baseline.dll', 'Engramic.Baseline.Windows.dll') {
              if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "$file is missing from the published folder" }
          }
          $expected = dotnet msbuild src/Engramic.Baseline.Cli/Engramic.Baseline.Cli.csproj -getProperty:Version
          $actual = & (Join-Path $dir 'baseline.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "baseline.exe --version exited with $LASTEXITCODE" }
          if ($actual -ne $expected) { throw "baseline.exe --version printed '$actual', but Directory.Build.props says '$expected'" }
          "baseline.exe --version: $actual"

      # A release signs only the files this repository built (tools/New-SignedRelease.ps1 -DotNet), so none of them
      # may be signed yet, and every other PE file must already carry Microsoft's valid, timestamped signature. A
      # package assembly compiled with ReadyToRun would have lost it.
      - name: Check the signatures of the published files
        run: ./tools/Test-ReleaseSignatures.ps1 -Path (Join-Path $env:RUNNER_TEMP 'baseline') -Unsigned

      - name: Publish the AOT canary (Native AOT, warnings as errors)
        run: dotnet publish tests/AotCanary/AotCanary.csproj --configuration Release --runtime win-x64 --no-restore --output "$env:RUNNER_TEMP/aot-canary"

      - name: Run the AOT canary
        run: |
          & (Join-Path $env:RUNNER_TEMP 'aot-canary/AotCanary.exe')
          if ($LASTEXITCODE -ne 0) { throw "The AOT canary exited with $LASTEXITCODE" }

  linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in the Windows job: the exact SDK in global.json, alone in its folder.
      - name: Read the SDK version from global.json
        id: sdk
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install that SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Check that the build uses that SDK
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          $actual = dotnet --version
          if ($actual -ne $env:SDK_VERSION) { throw "dotnet --version is $actual, but global.json names $env:SDK_VERSION" }

      # Baseline.Portable.slnf lists the projects that target net10.0 and their tests.
      - name: Restore the portable projects (locked)
        run: dotnet restore Baseline.Portable.slnf --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build Baseline.Portable.slnf --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution Baseline.Portable.slnf --configuration Release --no-build

  contracts:
    name: Contracts
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in the build job: the exact SDK in global.json, alone in its folder.
      - name: Read the SDK version from global.json
        id: sdk
        run: |
          $version = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install that SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Check that the build uses that SDK
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          $actual = dotnet --version
          if ($actual -ne $env:SDK_VERSION) { throw "dotnet --version is $actual, but global.json names $env:SDK_VERSION" }

      - name: Restore (locked)
        run: dotnet restore Baseline.slnx --locked-mode

      - name: Build the contract tests (warnings as errors)
        run: dotnet build tests/Engramic.Baseline.Contracts.Tests/Engramic.Baseline.Contracts.Tests.csproj --configuration Release --no-restore -warnaserror

      # The golden files of status.json, and the unchanged Intune scripts on it in 64-bit and 32-bit Windows
      # PowerShell 5.1, including the deliberate changes to a copy that each must catch.
      - name: Golden files and Intune-reader tests
        run: dotnet test --project tests/Engramic.Baseline.Contracts.Tests/Engramic.Baseline.Contracts.Tests.csproj --configuration Release --no-build

      # Self-contained, into a folder under Program Files that only administrators can change, since SYSTEM
      # runs it.
      - name: Publish baseline.exe
        run: dotnet publish src/Engramic.Baseline.Cli/Engramic.Baseline.Cli.csproj --configuration Release --runtime win-x64 --no-restore --output "$env:ProgramFiles\EngramicBaselineCI"

      # Install-CEChecker.ps1 makes the locked, sealed data folder; baseline.exe scheduled-audit runs as SYSTEM
      # through a temporary scheduled task and writes status.json; the Intune scripts read it and the module's.
      - name: Install, write status.json as SYSTEM, and compare what the Intune scripts report
        shell: powershell
        run: ./tools/contracts/Test-StatusContract.ps1 -BaselineExe "$env:ProgramFiles\EngramicBaselineCI\baseline.exe" -WorkPath "$env:RUNNER_TEMP\contracts" -TimeoutMinutes 10

      # In one folder, since the files sit on more than one drive: the steps' files, the install log and what the
      # test platform kept of a failed or hung test.
      - name: Gather what the steps wrote
        if: failure()
        run: |
          $kept = Join-Path $env:RUNNER_TEMP 'contracts-kept'
          New-Item -ItemType Directory -Path $kept -Force | Out-Null
          $from = @(
              (Join-Path $env:RUNNER_TEMP 'contracts'),
              (Join-Path $env:ProgramData 'EngramicBaseline\logs'),
              'artifacts/bin/Engramic.Baseline.Contracts.Tests/release/TestResults')
          foreach ($folder in $from) {
              if (Test-Path -LiteralPath $folder) { Copy-Item -LiteralPath $folder -Destination (Join-Path $kept (Split-Path -Leaf $folder)) -Recurse -Force }
          }

      - name: Keep what the steps wrote
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts
          path: ${{ runner.temp }}/contracts-kept
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: Parity
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in the build job: the exact SDK in global.json, alone in its folder.
      - name: Read the SDK version from global.json
        id: sdk
        run: |
          $version = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install that SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Check that the build uses that SDK
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          $actual = dotnet --version
          if ($actual -ne $env:SDK_VERSION) { throw "dotnet --version is $actual, but global.json names $env:SDK_VERSION" }

      - name: Restore (locked)
        run: dotnet restore Baseline.slnx --locked-mode

      # Self-contained, so it runs as SYSTEM without the SDK's runtime, from a folder only administrators can change.
      - name: Publish baseline.exe
        run: dotnet publish src/Engramic.Baseline.Cli/Engramic.Baseline.Cli.csproj --configuration Release --runtime win-x64 --no-restore --output "$env:ProgramFiles\EngramicBaselineCI"

      - name: SU-01 in the module and baseline.exe, as an elevated administrator
        shell: powershell
        run: ./tools/parity/Compare-Parity.ps1 -Id SU-01 -BaselineExe "$env:ProgramFiles\EngramicBaselineCI\baseline.exe" -OutputPath "$env:RUNNER_TEMP\parity\administrator" -ResultPath "$env:RUNNER_TEMP\parity\administrator.json"

      # The same comparison as SYSTEM, through a temporary scheduled task, from a folder only SYSTEM and
      # Administrators can change.
      - name: SU-01 in the module and baseline.exe, as SYSTEM
        shell: powershell
        run: |
          $shell = Join-Path ([Environment]::GetFolderPath('System')) 'WindowsPowerShell\v1.0\powershell.exe'
          $work = Join-Path $env:RUNNER_TEMP 'parity-system'
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', (Resolve-Path -LiteralPath 'tools/parity/Compare-Parity.ps1').ProviderPath,
            '-Id', 'SU-01', '-BaselineExe', (Join-Path $env:ProgramFiles 'EngramicBaselineCI\baseline.exe'),
            '-OutputPath', (Join-Path $work 'system'), '-ResultPath', (Join-Path $work 'system.json'))
          $run = ./tools/ci/Invoke-AsSystem.ps1 -FilePath $shell -ArgumentList $arguments -WorkPath $work -TimeoutSeconds 1200
          $run.Output | ForEach-Object { Write-Host $_ }
          $run.Errors | ForEach-Object { Write-Host "error: $_" }
          if ($run.ExitCode -ne 0) { throw "Compare-Parity.ps1 as SYSTEM exited with $($run.ExitCode)." }

      - name: Keep what the comparisons wrote
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity
          path: |
            ${{ runner.temp }}/parity
            ${{ runner.temp }}/parity-system
          if-no-files-found: ignore
          retention-days: 7

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ASCII text, and only public hosts and repository names
        shell: pwsh
        run: ./tools/hygiene/Test-Hygiene.ps1
